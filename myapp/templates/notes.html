{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/notes.css' %}">
{% endblock %}

{% block content %}

<div class="notes-container">

    <h1>📒 My Notes</h1>

    <!-- ADD NOTE FORM -->
    <form method="POST" action="{% url 'add_note' %}" class="note-form">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Note Title" required>
        <textarea name="content" placeholder="Write your note..." required></textarea>
        <button type="submit">➕ Add Note</button>
    </form>

    <!-- NOTES LIST -->
    <div class="notes-grid">

        {% for note in notes %}
        <div class="note-card">
            <h3>{{ note.title }}</h3>
            <p>{{ note.content }}</p>

            <small>{{ note.created_at }}</small>

            <a href="{% url 'delete_note' note.id %}" class="delete-btn">Delete</a>
        </div>
        {% empty %}
        <p>No notes yet. Start adding!</p>
        {% endfor %}

    </div>

</div>

{% endblock %}
