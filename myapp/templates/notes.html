{% extends 'base.html' %}

{% block content %}

<div class="module-container">
  <h2>Your Notes</h2>

  <!-- ADD NOTE FORM -->
  <form method="POST">
    {% csrf_token %}
    <input type="text" name="title" placeholder="Title" required><br><br>
    <textarea name="content" placeholder="Write your note..." required></textarea><br><br>
    <button class="login-btn">Add Note</button>
  </form>

  <hr><br>

  <!-- DISPLAY NOTES -->
  {% for note in notes %}
    <div class="card">
      <h3>{{ note.title }}</h3>
      <p>{{ note.content }}</p>

      <!-- DELETE BUTTON -->
      <form method="POST" action="{% url 'delete_note' note.id %}">
        {% csrf_token %}
        <button class="logout-btn">Delete</button>
      </form>

    </div>
  {% empty %}
    <p>No notes yet.</p>
  {% endfor %}

</div>

{% endblock %}
